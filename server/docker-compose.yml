services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pitlane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pitlane}
      POSTGRES_DB: ${POSTGRES_DB:-pitlane}
    volumes:
      - pitlane_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pitlane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pitlane}:${POSTGRES_PASSWORD:-pitlane}@db:5432/${POSTGRES_DB:-pitlane}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      PORT: 8787
    ports:
      - "8787:8787"

volumes:
  pitlane_db: